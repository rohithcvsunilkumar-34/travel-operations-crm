<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F284E"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="12"/>
  <!-- Compass / Diamond Travel Emblem -->
  <g transform="translate(256, 256)">
    <!-- North Pointer (Gold) -->
    <polygon points="0,-130 36,-20 0,0" fill="url(#gold)"/>
    <polygon points="0,-130 -36,-20 0,0" fill="#B45309"/>
    <!-- South Pointer -->
    <polygon points="0,130 36,20 0,0" fill="#3B82F6"/>
    <polygon points="0,130 -36,20 0,0" fill="#1D4ED8"/>
    <!-- East Pointer -->
    <polygon points="130,0 20,-36 0,0" fill="#93C5FD"/>
    <polygon points="130,0 20,36 0,0" fill="#60A5FA"/>
    <!-- West Pointer -->
    <polygon points="-130,0 -20,-36 0,0" fill="#FDE68A"/>
    <polygon points="-130,0 -20,36 0,0" fill="#F59E0B"/>
    <!-- Center Jewel -->
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#0B192C" stroke-width="4"/>
  </g>
</svg>

